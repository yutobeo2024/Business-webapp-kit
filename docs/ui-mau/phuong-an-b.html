<title>Giao diện Kit 1.8 phương án B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Bố cục: bảng điều khiển vận hành. Sidebar có nhóm và menu con, nền xanh xám rất nhạt, thẻ trắng bo 14px,
   ô số liệu có chip icon màu pastel (bảng màu phân loại cố định), màu thương hiệu cho hành động/mục chọn/biểu đồ chính.
   Chữ tiêu đề màu "mực" pha từ màu thương hiệu nên mỗi khách có tông riêng mà vẫn đọc rõ. */
:root {
  --brand: #1aa5a2; --brand-fg: #ffffff; --brand-dark: #4fd1cd; --brand-dark-fg: #06201f;
  --primary: var(--brand); --primary-fg: var(--brand-fg);
  --ink-base: #0f1d33;
  --bg: #f4f7f8; --surface: #ffffff; --surface-2: #f1f5f6; --border: #e2e9ec; --border-strong: #cdd8dc;
  --fg: #1c2836; --muted: #6b7885; --faint: #95a1ab;
  --success: #138a4f; --warning: #b26a00; --danger: #d0353f; --info: #2563c9; --neutral: #6b7885;
  --c1: #1aa5a2; --c2: #7c5cc4; --c3: #c98a1b; --c4: #2f7fd8; --c5: #d0536b; --c6: #5d6b78;
  --overlay: rgb(12 22 34 / .45);
  --shadow: 0 1px 2px rgb(16 40 60 / .05), 0 4px 16px -6px rgb(16 40 60 / .08);
  --shadow-pop: 0 18px 40px -12px rgb(16 40 60 / .28), 0 2px 8px rgb(16 40 60 / .08);
  --radius: 10px; --radius-lg: 14px;
  --font: "Be Vietnam Pro", ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --sidebar-w: 264px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: var(--brand-dark); --primary-fg: var(--brand-dark-fg); --ink-base: #eef3f6;
    --bg: #0b1117; --surface: #121a22; --surface-2: #18222c; --border: #233140; --border-strong: #2f3f4f;
    --fg: #dde5ec; --muted: #93a2b0; --faint: #66788a;
    --success: #43c983; --warning: #f0b14c; --danger: #f2727a; --info: #74a8f0; --neutral: #93a2b0;
    --c1: #4fd1cd; --c2: #a98cf0; --c3: #e9b85a; --c4: #6ea9f2; --c5: #ef8aa0; --c6: #9aa9b6;
    --overlay: rgb(0 0 0 / .6);
    --shadow: 0 0 0 1px var(--border); --shadow-pop: 0 18px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--border);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: var(--brand-dark); --primary-fg: var(--brand-dark-fg); --ink-base: #eef3f6;
  --bg: #0b1117; --surface: #121a22; --surface-2: #18222c; --border: #233140; --border-strong: #2f3f4f;
  --fg: #dde5ec; --muted: #93a2b0; --faint: #66788a;
  --success: #43c983; --warning: #f0b14c; --danger: #f2727a; --info: #74a8f0; --neutral: #93a2b0;
  --c1: #4fd1cd; --c2: #a98cf0; --c3: #e9b85a; --c4: #6ea9f2; --c5: #ef8aa0; --c6: #9aa9b6;
  --overlay: rgb(0 0 0 / .6);
  --shadow: 0 0 0 1px var(--border); --shadow-pop: 0 18px 40px -10px rgb(0 0 0 / .7), 0 0 0 1px var(--border);
  color-scheme: dark;
}
:root {
  --ink: color-mix(in oklab, var(--ink-base) 86%, var(--primary));
  --primary-soft: color-mix(in oklab, var(--primary) 13%, var(--surface));
  --primary-hover: color-mix(in oklab, var(--primary) 85%, var(--ink-base));
  --ring: color-mix(in oklab, var(--primary) 50%, transparent);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; font-weight: 500; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { color: var(--ink); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Dải điều khiển bản mẫu */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px dashed var(--border-strong); font-size: 13px; }
.demo .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.demo .lbl { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.demo input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }

/* Khung */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100% - 46px); }
.app.collapsed { --sidebar-w: 76px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-right: 1px solid var(--border); padding: 14px 12px; overflow-y: auto; }
.brandbox { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
.logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--primary-fg); font-weight: 800; font-size: 14px; letter-spacing: .02em;
  background: linear-gradient(135deg, var(--primary), color-mix(in oklab, var(--primary) 60%, var(--c2))); }
.brandname { line-height: 1.15; min-width: 0; }
.brandname strong { display: block; font-size: 15px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.brandname span { font-size: 12px; color: var(--muted); }
.navgroup { font-size: 11.5px; color: var(--faint); padding: 14px 12px 6px; font-weight: 600; letter-spacing: .03em; }
.navlink { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; min-height: 40px; font-weight: 500; }
.navlink:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.navlink[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.navlink .chev { margin-left: auto; width: 15px; height: 15px; transition: transform .15s; }
.navlink[aria-expanded="true"] .chev { transform: rotate(90deg); }
.navlink .count { margin-left: auto; font-size: 11.5px; min-width: 22px; text-align: center; border-radius: 999px; padding: 1px 7px; font-weight: 600; background: color-mix(in oklab, var(--danger) 14%, var(--surface)); color: var(--danger); }
.sub { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 22px; padding-left: 12px; border-left: 1px solid var(--border); }
.sub .navlink { min-height: 36px; padding: 7px 10px; font-size: 13.5px; }
.sidebar .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid var(--border); }
.sidebar .me .who { min-width: 0; line-height: 1.2; }
.sidebar .me strong { display: block; color: var(--ink); font-size: 13.5px; }
.sidebar .me small { color: var(--muted); font-size: 12px; }
.app.collapsed .brandname, .app.collapsed .navgroup, .app.collapsed .navlabel, .app.collapsed .navlink .count, .app.collapsed .navlink .chev, .app.collapsed .sub, .app.collapsed .me .who { display: none; }
.app.collapsed .navlink, .app.collapsed .brandbox, .app.collapsed .me { justify-content: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 64px; padding: 0 24px; background: color-mix(in oklab, var(--surface) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.searchbox { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; width: min(420px, 100%); border-radius: 10px; background: var(--surface-2); color: var(--faint); border: 1px solid transparent; cursor: pointer; }
.searchbox kbd { margin-left: auto; font: 600 11px var(--font); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; color: var(--muted); }
.spacer { flex: 1; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--border-strong); }
.iconbtn .n { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.av { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; color: var(--tone, var(--primary)); background: color-mix(in oklab, var(--tone, var(--primary)) 16%, var(--surface)); }
.av.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.av.solid { background: var(--primary); color: var(--primary-fg); }
.userbtn { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 6px 4px 4px; border-radius: 12px; cursor: pointer; text-align: left; }
.userbtn:hover { background: var(--surface-2); }
.userbtn .who { line-height: 1.2; }
.userbtn .who strong { color: var(--ink); font-size: 13.5px; display: block; }
.userbtn .who small { color: var(--muted); font-size: 12px; }
.menu-mobile { display: none; }

.content { padding: 24px 28px 56px; max-width: 1360px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.crumbs svg.i { width: 14px; height: 14px; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.pagehead .t { flex: 1 1 340px; min-width: 0; }
.pagehead h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--border-strong); background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); box-shadow: 0 6px 16px -8px var(--primary); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.btn.danger { color: var(--danger); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; box-shadow: none; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 16px 18px 0; }
.card > header h2 { margin: 0; font-size: 15.5px; font-weight: 700; }
.card > header .hint { color: var(--muted); font-size: 12.5px; width: 100%; margin-top: -6px; }
.card .body { padding: 16px 18px 18px; }

/* Ô số liệu */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.chipic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--tone); background: color-mix(in oklab, var(--tone) 14%, var(--surface)); grid-row: 1 / 3; grid-column: 2; }
.kpi .k { color: var(--muted); font-size: 13px; font-weight: 500; }
.kpi .v { font-size: 26px; line-height: 1.15; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.kpi .v small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi .foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
.trend.up { color: var(--success); background: color-mix(in oklab, var(--success) 12%, var(--surface)); }
.trend.down { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, var(--surface)); }
.spark { width: 84px; height: 28px; }

.row2 { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--tone); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--faint); font: 500 11px var(--font); }
.donutwrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
.donutwrap ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.donutwrap li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.donutwrap li i { width: 10px; height: 10px; border-radius: 3px; background: var(--tone); }
.donutwrap li b { color: var(--ink); font-weight: 600; }
.prog { display: flex; flex-direction: column; gap: 14px; }
.prog .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13px; }
.prog .r b { color: var(--ink); font-weight: 600; }
.prog .bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.prog .bar i { display: block; height: 100%; border-radius: 99px; background: var(--tone); }
.tasks { list-style: none; margin: 0; padding: 0; }
.tasks li { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border); }
.tasks .g { flex: 1; min-width: 0; }
.tasks .g strong { display: block; color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tasks .g span { color: var(--muted); font-size: 12.5px; }
.tasks .amt { text-align: right; font-weight: 600; color: var(--ink); font-size: 13.5px; }
.tasks .amt small { display: block; font-weight: 500; color: var(--warning); font-size: 11.5px; }

/* Nhãn trạng thái */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--tone); background: color-mix(in oklab, var(--tone) 13%, var(--surface)); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-success { --tone: var(--success); } .t-warning { --tone: var(--warning); } .t-danger { --tone: var(--danger); }
.t-info { --tone: var(--info); } .t-neutral { --tone: var(--neutral); } .t-brand { --tone: var(--primary); }
.t-c1 { --tone: var(--c1); } .t-c2 { --tone: var(--c2); } .t-c3 { --tone: var(--c3); } .t-c4 { --tone: var(--c4); } .t-c5 { --tone: var(--c5); } .t-c6 { --tone: var(--c6); }

/* Danh sách */
.tabsbar { display: flex; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; overflow-x: auto; max-width: 100%; }
.tabsbar button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabsbar button .c { font-size: 11.5px; padding: 0 7px; border-radius: 99px; background: var(--surface); color: var(--muted); }
.tabsbar button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabsbar button[aria-selected="true"] .c { background: var(--primary); color: var(--primary-fg); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; align-items: center; border-bottom: 1px solid var(--border); }
.input, .select { height: 40px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0 12px; min-width: 0; }
.input:focus, .select:focus, textarea:focus { outline: 3px solid var(--ring); outline-offset: 0; border-color: var(--primary); }
.searchfield { position: relative; flex: 1 1 260px; max-width: 380px; }
.searchfield svg { position: absolute; left: 12px; top: 11px; color: var(--faint); }
.searchfield .input { width: 100%; padding-left: 38px; background: var(--surface-2); border-color: transparent; }
.viewtoggle { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-left: auto; }
.viewtoggle button { width: 40px; height: 38px; display: grid; place-items: center; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.viewtoggle button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 18px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); }
th button { all: unset; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
th button svg.i { width: 13px; height: 13px; }
td { border-top: 1px solid var(--border); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in oklab, var(--primary) 4%, var(--surface)); }
td.r, th.r { text-align: right; }
td .code { font-weight: 700; color: var(--primary); }
.person { display: flex; align-items: center; gap: 10px; }
.person .n { color: var(--ink); font-weight: 600; display: block; }
.person small { color: var(--muted); font-size: 12px; }
td.wrap { white-space: normal; min-width: 220px; color: var(--fg); }
td.money { font-weight: 600; color: var(--ink); }
.sticky1 { position: sticky; left: 0; background: var(--surface); z-index: 1; }
th.sticky1 { background: var(--surface-2); z-index: 2; }
.rowact { width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--faint); display: grid; place-items: center; cursor: pointer; }
.rowact:hover { background: var(--surface-2); color: var(--ink); }
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
.pages { display: flex; gap: 4px; }
.pages button { min-width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; color: var(--muted); }
.pages button[aria-current="page"] { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }

.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding: 16px 18px 18px; }
.col { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col h3 { margin: 2px 4px 2px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.col h3 .c { margin-left: auto; color: var(--muted); font-weight: 600; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border-top: 3px solid var(--tone); }
.tile .top { display: flex; justify-content: space-between; font-size: 12px; }
.tile .top b { color: var(--primary); }
.tile .top span { color: var(--muted); }
.tile p { margin: 0; color: var(--ink); font-weight: 600; font-size: 13.5px; }
.tile .bot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile .bot b { color: var(--ink); }

.skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), color-mix(in oklab, var(--surface-2) 40%, var(--border)), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 44px 16px; }

/* Màu thương hiệu: giống scripts/brand.mjs sẽ làm. */
function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function rgbToHex(c) { return "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join(""); }
function lum(c) { const a = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mix(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
function applyBrand(hex) {
  let c = hexToRgb(hex);
  const white = [255, 255, 255], ink = [6, 18, 30];
  // Nút chính dùng chữ trắng nếu được; màu quá sáng thì tối dần tới khi chữ trắng đạt 4.5:1 (giữ đúng tông khách).
  let g = 0; while (contrast(c, white) < 4.5 && g++ < 30) c = mix(c, [0, 0, 0], 0.06);
  const d = mix(c, white, 0.4);
  const r = document.documentElement.style;
  r.setProperty("--brand", rgbToHex(c)); r.setProperty("--brand-fg", "#ffffff");
  r.setProperty("--brand-dark", rgbToHex(d)); r.setProperty("--brand-dark-fg", rgbToHex(contrast(d, ink) >= 4.5 ? ink : white));
  r.setProperty("--c1", rgbToHex(c));
}

/* Biểu đồ vẽ theo đúng tỉ lệ dữ liệu */
function spark(vals, tone) {
  const w = 84, h = 28, mx = Math.max(...vals), mn = Math.min(...vals);
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, h - 3 - ((v - mn) / (mx - mn || 1)) * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h} Z" fill="var(--${tone})" opacity=".12"/><path d="${d}" fill="none" stroke="var(--${tone})" stroke-width="2" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.6" fill="var(--${tone})"/></svg>`;
}
function areaChart() {
  const m = ["T5", "T6", "T7", "T8", "T9", "T10"], a = [52, 61, 48, 74, 69, 82], b = [40, 50, 45, 58, 66, 61];
  const W = 640, H = 230, L = 36, R = 10, T = 12, B = 26, max = 100;
  const x = (i) => L + (i * (W - L - R)) / (m.length - 1), y = (v) => T + (1 - v / max) * (H - T - B);
  const path = (s) => s.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  let g = "";
  for (const t of [0, 25, 50, 75, 100]) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--border)" stroke-dasharray="${t ? "3 4" : "0"}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  m.forEach((t, i) => (g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${t}</text>`));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tạm ứng và quyết toán 6 tháng, đơn vị triệu đồng">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
    ${g}<path d="${path(a)} L${x(5)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#ga)"/>
    <path d="${path(a)}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="${path(b)}" fill="none" stroke="var(--c2)" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round"/>
    ${a.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === 5 ? 5 : 3}" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.2"/>`).join("")}

  </svg>`;
}

    <li class="t-neutral"><span class="mk">${ic("bank")}</span><div><div class="w">Kế toán chi tiền</div><div class="m">Chưa tới bước này</div></div></li></ol></div>`;
  if (state.tab === "files") body = `<div class="body"><div class="files">
    <div class="file"><span class="chipic t-c5" style="grid-row:auto">${ic("file")}</span><div class="g"><a href="#">ke-hoach-khao-sat.pdf</a><small>248 KB · 03/10/2026</small></div></div>
    <div class="file"><span class="chipic t-success" style="grid-row:auto;--tone:var(--success)">${ic("table")}</span><div class="g"><a href="#">bao-gia-thue-xe.xlsx</a><small>36 KB · 03/10/2026</small></div></div></div>
    <div style="margin-top:12px"><button class="btn soft sm">${ic("clip")}Đính kèm tệp</button></div></div>`;
  return `<div class="crumbs">${ic("home")}<span>Tạm ứng</span>${ic("chev")}<a href="#" data-go="list">Phiếu tạm ứng</a>${ic("chev")}<span>TU-2026-0148</span></div>
  <section class="card hero">
    <div><div class="top"><span class="code">TU-2026-0148</span><span class="pill t-warning">Chờ trưởng phòng</span></div>
      <h1>Công tác khảo sát kho Bình Dương</h1><div class="meta">Lập ngày 03/10/2026 bởi Nguyễn Thị Lan · Kinh doanh miền Nam</div></div>
    <div class="actions"><button class="btn">${ic("print")}In PDF</button><button class="btn danger">Từ chối</button><button class="btn primary">${ic("check")}Duyệt phiếu</button></div>

      <div class="fact big"><dt>Số tiền đề nghị</dt><dd class="num">${vnd(total)}</dd></div>

  </section>
  <section class="card"><div class="dtabs" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l} (${n})</button>`).join("")}</div>${body}</section>

function loginView() {
  return `<div class="login"><div class="grid"></div><div class="box">
    <section class="pitch"><div class="brandbox" style="padding:0"><div class="logo">MP</div><div class="brandname"><strong style="color:inherit">Công ty Minh Phát</strong><span style="color:inherit;opacity:.8">Tạm ứng và thanh toán</span></div></div>
      <h2>Lập phiếu trên điện thoại, duyệt ngay khi nhận thông báo</h2>
      <p>Trưởng phòng duyệt nhiều cấp, kế toán chi và theo dõi quyết toán, nhắc quá hạn qua email và Zalo.</p>
      <div class="mini"><div><b class="num">2 giờ</b><span>thời gian duyệt trung bình</span></div><div><b class="num">148</b><span>phiếu năm 2026</span></div></div></section>
    <form id="loginForm">
      <h1>Đăng nhập</h1><p class="hint">Dùng email công ty và mật khẩu được cấp.</p>
      <label class="field" for="l-email"><span>Email</span><input class="input" id="l-email" type="email" autocomplete="username" value="lan.nguyen@minhphat.vn"></label>
      <label class="field" for="l-pass"><span>Mật khẩu</span><input class="input" id="l-pass" type="password" autocomplete="current-password" value="matkhauvidu"></label>
      <div class="row"><label for="l-keep"><input type="checkbox" id="l-keep" checked> Ghi nhớ trên máy này</label><span>Quên mật khẩu? Liên hệ quản trị.</span></div>
      <button class="btn primary" type="submit">Đăng nhập</button>
    </form></div></div>`;
}

function render() {
  const root = document.getElementById("root");
  if (state.screen === "login") root.innerHTML = loginView();
  else {
    const view = { home: homeView, list: listView, detail: detailView, empty: emptyView }[state.screen] || homeView;
    root.innerHTML = `<div class="app ${state.collapsed ? "collapsed" : ""} ${state.open ? "open" : ""}">${sidebar()}<div class="main">${topbar()}<main class="content">${view()}</main></div></div>`;
  }
  document.querySelectorAll("#screens button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === state.screen)));
  document.querySelectorAll("#themes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === state.theme)));
  document.querySelectorAll(".sw").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === state.color)));
}
function go(s) {
  const map = { home: "home", list: "list", detail: "detail", empty: "empty", login: "login" };
  state.screen = map[s] || "list"; state.open = false; if (s === "detail") state.tab = "lines"; save(); render(); window.scrollTo(0, 0);
}
let toastTimer;
function toast(title, sub) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="ok">${ic("check")}</span><div><b>${title}</b><span>${sub}</span></div>`;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-s],[data-t],[data-c],[data-v],[data-tab],[data-tg],[data-open],#collapse,#openMenu,#scrim");
  if (!t) return;
  if (t.matches("a")) e.preventDefault();
  if (t.dataset.s) go(t.dataset.s);
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.t) { state.theme = t.dataset.t; applyTheme(); save(); render(); }
  else if (t.dataset.c) { state.color = t.dataset.c; applyBrand(state.color); save(); render(); }
  else if (t.dataset.v) { state.view = t.dataset.v; save(); render(); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; render(); }
  else if (t.dataset.tg) { state.expanded[t.dataset.tg] = !state.expanded[t.dataset.tg]; if (state.collapsed) state.collapsed = false; save(); render(); }
  else if (t.hasAttribute("data-open")) { document.getElementById("e-purpose").hidden = true; document.getElementById("f-purpose").removeAttribute("aria-invalid"); document.getElementById("dlg").showModal(); }
  else if (t.id === "collapse") { state.collapsed = !state.collapsed; save(); render(); }
  else if (t.id === "openMenu") { state.open = true; render(); }
  else if (t.id === "scrim") { state.open = false; render(); }
});
document.getElementById("customColor").addEventListener("input", (e) => { state.color = e.target.value; applyBrand(state.color); save(); render(); });
document.getElementById("dlgCancel").addEventListener("click", () => document.getElementById("dlg").close());
document.getElementById("dlgForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const p = document.getElementById("f-purpose");
  if (!p.value.trim()) { p.setAttribute("aria-invalid", "true"); document.getElementById("e-purpose").hidden = false; p.focus(); return; }
  document.getElementById("dlg").close(); p.value = ""; toast("Đã lưu nháp TU-2026-0149", "Gửi duyệt khi bạn sẵn sàng.");
});
document.addEventListener("submit", (e) => { if (e.target.id === "loginForm") { e.preventDefault(); go("home"); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open) { state.open = false; render(); } });
applyBrand(state.color); applyTheme(); render();
</script>
