<title>Giao diện Kit 1.8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: công cụ làm việc. Sidebar trái thu gọn được + header mỏng + vùng nội dung lấy bảng làm trung tâm.
   Màu thương hiệu (--brand) chỉ cho hành động chính, mục đang chọn, liên kết, tiêu điểm; trạng thái dùng màu ngữ nghĩa cố định. */
:root {
  --brand: #0b5fff; --brand-fg: #ffffff;          /* JS tính từ mã màu khách hàng (giống scripts/brand.mjs sẽ làm) */
  --brand-dark: #6f9bff; --brand-dark-fg: #0b1020;
  --primary: var(--brand); --primary-fg: var(--brand-fg);
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e1e4ea; --border-strong: #cdd2da;
  --fg: #151820; --muted: #5c6472; --faint: #8a919d;
  --success: #17803d; --warning: #a85b06; --danger: #c22c2c; --info: #1d6db0; --neutral: #5c6472;
  --overlay: rgb(15 18 24 / .45);
  --shadow-pop: 0 10px 30px -10px rgb(15 18 24 / .25), 0 2px 6px rgb(15 18 24 / .08);
  --radius: 8px;
  --font: "Be Vietnam Pro", ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --sidebar-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: var(--brand-dark); --primary-fg: var(--brand-dark-fg);
    --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --border: #262b33; --border-strong: #353b45;
    --fg: #e7e9ed; --muted: #9ba2ad; --faint: #6f7682;
    --success: #4cc77a; --warning: #f0a94a; --danger: #f27272; --info: #6fb0ea; --neutral: #9ba2ad;
    --overlay: rgb(0 0 0 / .6);
    --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / .6), 0 0 0 1px var(--border);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: var(--brand-dark); --primary-fg: var(--brand-dark-fg);
  --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --border: #262b33; --border-strong: #353b45;
  --fg: #e7e9ed; --muted: #9ba2ad; --faint: #6f7682;
  --success: #4cc77a; --warning: #f0a94a; --danger: #f27272; --info: #6fb0ea; --neutral: #9ba2ad;
  --overlay: rgb(0 0 0 / .6);
  --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / .6), 0 0 0 1px var(--border);
  color-scheme: dark;
}
:root {
  --primary-soft: color-mix(in oklab, var(--primary) 11%, var(--surface));
  --primary-hover: color-mix(in oklab, var(--primary) 86%, var(--fg));
  --ring: color-mix(in oklab, var(--primary) 55%, transparent);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Thanh điều khiển bản mẫu (không thuộc app) */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px dashed var(--border-strong); font-size: 13px; }
.demo b { font-weight: 600; }
.demo .grp { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.demo .lbl { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border-strong); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.demo input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 6px; background: none; cursor: pointer; }

/* Khung app */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100% - 46px); }
.app.collapsed { --sidebar-w: 68px; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 10px; gap: 4px; overflow-y: auto; }
.brandbox { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); font-weight: 700; font-size: 13px; letter-spacing: .02em; flex: none; }
.brandname { line-height: 1.2; min-width: 0; }
.brandname strong { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brandname span { font-size: 12px; color: var(--muted); }
.navgroup { font-size: 12px; color: var(--faint); padding: 14px 10px 4px; font-weight: 500; }
.navlink { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: var(--muted); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; min-height: 38px; }
.navlink:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
.navlink[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.navlink .count { margin-left: auto; font-size: 12px; background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 0 7px; font-weight: 500; }
.navlink[aria-current="page"] .count { background: var(--primary); color: var(--primary-fg); }
.sidebar .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
.app.collapsed .brandname, .app.collapsed .navgroup, .app.collapsed .navlabel, .app.collapsed .navlink .count { display: none; }
.app.collapsed .navlink { justify-content: center; }
.app.collapsed .brandbox { justify-content: center; padding-inline: 0; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs strong { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumbs svg.i { width: 14px; height: 14px; }
.spacer { flex: 1; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); color: var(--fg); }
.dot { position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--bg); }
.searchbtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; min-width: 240px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--faint); cursor: pointer; }
.searchbtn kbd { margin-left: auto; font: 500 11px var(--font); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 12px; border: 1px solid var(--border); }
.userbtn { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
.userbtn:hover { background: var(--surface-2); }
.userbtn .who { text-align: left; line-height: 1.2; }
.userbtn .who small { display: block; color: var(--muted); font-size: 12px; }
.menu-mobile { display: none; }

.content { padding: 24px 24px 48px; max-width: 1280px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Thành phần */
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.pagehead .t { flex: 1 1 320px; min-width: 0; }
.pagehead h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.panel > header h2 { margin: 0; font-size: 15px; font-weight: 600; }
.panel > header .sub { color: var(--muted); font-size: 13px; }
.panel .body { padding: 16px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.stat .k { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.stat .v { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.stat .d { font-size: 12px; color: var(--muted); }
.stat .d.up { color: var(--success); }
.stat.attn { border-color: color-mix(in oklab, var(--warning) 45%, var(--border)); }
.stat.attn .k { color: var(--warning); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--tone); background: color-mix(in oklab, var(--tone) 12%, var(--surface)); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-success { --tone: var(--success); } .t-warning { --tone: var(--warning); } .t-danger { --tone: var(--danger); }
.t-info { --tone: var(--info); } .t-neutral { --tone: var(--neutral); } .t-brand { --tone: var(--primary); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); align-items: center; }
.input, .select { height: 36px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 0 10px; min-width: 0; }
.input:focus, .select:focus, textarea:focus { outline: 2px solid var(--ring); outline-offset: 0; border-color: var(--primary); }
.searchfield { position: relative; flex: 1 1 260px; max-width: 360px; }
.searchfield svg { position: absolute; left: 10px; top: 9px; color: var(--faint); }
.searchfield .input { width: 100%; padding-left: 34px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px dashed var(--border-strong); border-radius: 999px; color: var(--muted); font-size: 13px; background: none; cursor: pointer; }
.chip.on { border-style: solid; color: var(--fg); background: var(--surface-2); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
th button { all: unset; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
th button svg.i { width: 13px; height: 13px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in oklab, var(--surface-2) 70%, var(--surface)); }
td.r, th.r { text-align: right; }
td .code { font-weight: 600; color: var(--fg); }
td .sub { display: block; font-size: 12px; color: var(--muted); }
td.wrap { white-space: normal; min-width: 220px; }
.sticky1 { position: sticky; left: 0; background: var(--surface); z-index: 1; }
th.sticky1 { background: var(--surface-2); z-index: 2; }
tbody tr:last-child td { border-bottom: 0; }
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
.pager .pp { display: flex; gap: 6px; align-items: center; }

.skel { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), color-mix(in oklab, var(--surface-2) 50%, var(--border)), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 48px 16px; }
.empty .ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.empty h3 { margin: 4px 0 0; font-size: 15px; font-weight: 600; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; color: var(--danger); background: color-mix(in oklab, var(--danger) 9%, var(--surface)); border: 1px solid color-mix(in oklab, var(--danger) 30%, var(--border)); }
.alert p { margin: 0; color: var(--fg); }

.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.dl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 20px; margin: 0; }
.dl div { min-width: 0; }
.dl dt { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.dl dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.dl .wide { grid-column: 1 / -1; }
.amount { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding-bottom: 16px; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 1px; background: var(--border); }
.timeline li:last-child::before { display: none; }
.timeline .mk { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.timeline .mk svg.i { width: 12px; height: 12px; }
.timeline .mk.ok { background: color-mix(in oklab, var(--success) 14%, var(--surface)); color: var(--success); border-color: transparent; }
.timeline .mk.now { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.timeline .w { font-weight: 500; }
.timeline .m { font-size: 12px; color: var(--muted); }
.timeline .note { margin-top: 4px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font-size: 13px; }
.lines td { white-space: normal; }
.total td { font-weight: 600; background: var(--surface-2); }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
.file small { color: var(--muted); display: block; }
.stickybar { display: none; }

.tasks { list-style: none; margin: 0; padding: 0; }
.tasks li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.tasks li:last-child { border-bottom: 0; }
.tasks .grow { flex: 1; min-width: 0; }
.tasks .grow strong { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tasks .grow span { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
.bar .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar .fill { height: 100%; background: var(--primary); border-radius: 4px; }

/* Hộp thoại */
dialog { border: 0; padding: 0; border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: var(--shadow-pop); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: var(--overlay); }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
dialog header { padding: 18px 20px 4px; }
dialog header h2 { margin: 0; font-size: 17px; font-weight: 600; }
dialog header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
dialog .dbody { padding: 16px 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 13px; font-weight: 500; }
.field > span em { color: var(--danger); font-style: normal; }
.field small { color: var(--muted); font-size: 12px; }
.field .err { color: var(--danger); font-size: 12px; }
.field .input, .field .select { height: 40px; width: 100%; }
.field .input[aria-invalid="true"] { border-color: var(--danger); }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; min-height: 76px; }

.toast { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-pop); max-width: calc(100vw - 32px); }
.toast .ok { color: var(--success); }

/* Đăng nhập */
.login { min-height: calc(100vh - 46px); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.login .side { background: var(--primary); color: var(--primary-fg); padding: 40px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
.login .side .logo { background: var(--primary-fg); color: var(--primary); }
.login .side h2 { font-size: 28px; line-height: 1.25; font-weight: 600; margin: 0; max-width: 18ch; text-wrap: balance; }
.login .side p { opacity: .85; max-width: 44ch; margin: 12px 0 0; }
.login .side ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; opacity: .92; }
.login .side li { display: flex; gap: 10px; align-items: center; }
.login .formside { display: grid; place-items: center; padding: 32px 16px; background: var(--surface); }
.login form { width: min(380px, 100%); display: flex; flex-direction: column; gap: 16px; }
.login form h1 { margin: 0; font-size: 22px; font-weight: 600; }
.login form p.hint { margin: -8px 0 0; color: var(--muted); }
.login .btn.primary { height: 42px; }

/* Ngăn kéo menu trên điện thoại / máy tính bảng */
.scrim { display: none; }
@media (max-width: 1023px) {
  .app, .app.collapsed { grid-template-columns: minmax(0, 1fr); --sidebar-w: 280px; }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: 280px; height: auto; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-pop); padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .app.open .sidebar { transform: none; }
  .app.open .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: var(--overlay); }
  .app.collapsed .brandname, .app.collapsed .navgroup, .app.collapsed .navlabel, .app.collapsed .navlink .count { display: revert; }
  .app.collapsed .navlink { justify-content: flex-start; }
  .collapse-btn { display: none; }
  .menu-mobile { display: inline-grid; }
  .searchbtn { min-width: 0; width: 38px; padding: 0; justify-content: center; border: 0; background: none; }
  .searchbtn span, .searchbtn kbd { display: none; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .topbar { padding: 0 8px 0 4px; }
  .userbtn .who { display: none; }
  .content { padding: 16px 16px 96px; gap: 16px; }
  .pagehead h1 { font-size: 19px; }
  .pagehead .actions { width: 100%; }
  .pagehead .actions .btn { flex: 1; }
  .dl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat .v { font-size: 19px; }
  .searchfield { max-width: none; flex-basis: 100%; }
  dialog { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 92vh; }
  dialog form { max-height: 92vh; }
  dialog .dbody { grid-template-columns: minmax(0, 1fr); }
  dialog footer { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  dialog footer .btn { flex: 1; }

/* Màu thương hiệu: giống scripts/brand.mjs sẽ làm. Bản tối pha sáng hơn; chữ trên nền chính chọn trắng/đen theo tương phản. */
function hexToRgb(h) { h = h.replace("#", ""); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function rgbToHex(c) { return "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join(""); }
function lum(c) { const a = c.map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2]; }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
function mix(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
function applyBrand(hex) {
  let c = hexToRgb(hex);
  // Màu quá sáng không đọc được chữ trắng lẫn làm nút: tối dần tới khi chữ trắng hoặc đen đạt 4.5:1.
  const white = [255, 255, 255], ink = [11, 16, 32];
  const fgFor = (x) => (contrast(x, white) >= 4.5 ? white : contrast(x, ink) >= 4.5 ? ink : null);
  let guard = 0; while (!fgFor(c) && guard++ < 20) c = mix(c, [0, 0, 0], 0.08);
  let d = mix(c, white, 0.38);
  const r = document.documentElement.style;
  r.setProperty("--brand", rgbToHex(c)); r.setProperty("--brand-fg", rgbToHex(fgFor(c)));
  r.setProperty("--brand-dark", rgbToHex(d)); r.setProperty("--brand-dark-fg", rgbToHex(contrast(d, ink) >= 4.5 ? ink : white));
}

        <div class="tablewrap"><table class="lines"><thead><tr><th>Nội dung</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead>
        <tbody>${lines.map(([n, q, p]) => `<tr><td>${n}</td><td class="r num">${q}</td><td class="r num">${vnd(p)}</td><td class="r num">${vnd(q * p)}</td></tr>`).join("")}
        <tr class="total"><td colspan="3">Tổng cộng</td><td class="r num">${vnd(total)}</td></tr></tbody></table></div></section>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="panel"><header><h2>Tiến trình duyệt</h2></header><div class="body"><ol class="timeline">
        <li><span class="mk ok">${ic("check")}</span><div><div class="w">Gửi duyệt</div><div class="m">Nguyễn Thị Lan · 03/10/2026 09:12</div></div></li>
        <li><span class="mk now">${ic("clock")}</span><div><div class="w">Trưởng phòng duyệt</div><div class="m">Đang chờ: Hoàng Văn Tùng</div><div class="note">Đã nhắc qua Zalo lúc 04/10/2026 08:00.</div></div></li>
        <li><span class="mk">${ic("bank")}</span><div><div class="w">Kế toán chi tiền</div><div class="m">Chưa tới bước này</div></div></li>
      </ol></div></section>
      <section class="panel"><header><h2>Tệp đính kèm</h2><span class="spacer"></span><button class="btn sm">${ic("clip")}Đính kèm</button></header><div class="body files">
        <div class="file">${ic("file")}<div><a href="#">ke-hoach-khao-sat.pdf</a><small>248 KB · 03/10/2026</small></div></div>
        <div class="file">${ic("file")}<div><a href="#">bao-gia-thue-xe.xlsx</a><small>36 KB · 03/10/2026</small></div></div>

  </div>
  <div class="stickybar"><button class="btn danger">Từ chối</button><button class="btn primary">${ic("check")}Duyệt phiếu</button></div>`;
}
function loginView() {
  return `<div class="login">
    <section class="side"><div class="brandbox" style="padding:0"><div class="logo">MP</div><div class="brandname"><strong>Công ty Minh Phát</strong></div></div>

      <ul><li>${ic("check")}Duyệt nhiều cấp theo phòng ban</li><li>${ic("check")}Nhắc quyết toán quá hạn qua email, Zalo</li><li>${ic("check")}Xuất Excel, in phiếu PDF đúng mẫu</li></ul>
      <div class="foot" style="font-size:12px;opacity:.75">© 2026 Công ty TNHH Minh Phát</div></section>
    <section class="formside"><form id="loginForm">
      <h1>Đăng nhập</h1><p class="hint">Dùng email công ty và mật khẩu được cấp.</p>
      <label class="field" for="l-email"><span>Email</span><input class="input" id="l-email" type="email" autocomplete="username" value="lan.nguyen@minhphat.vn"></label>
      <label class="field" for="l-pass"><span>Mật khẩu</span><input class="input" id="l-pass" type="password" autocomplete="current-password" value="••••••••••"></label>
      <button class="btn primary" type="submit">Đăng nhập</button>
      <p class="hint" style="margin:0;font-size:13px">Quên mật khẩu? Liên hệ quản trị hệ thống của công ty.</p>
    </form></section></div>`;
}

function render() {
  const root = document.getElementById("root");
  if (state.screen === "login") { root.innerHTML = loginView(); }
  else {
    const view = { home: homeView, list: listView, detail: detailView, empty: emptyView }[state.screen] || listView;
    root.innerHTML = `<div class="app ${state.collapsed ? "collapsed" : ""} ${state.open ? "open" : ""}">${sidebar()}<div class="main">${topbar()}<main class="content">${view()}</main></div></div>`;
  }
  document.querySelectorAll("#screens button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.s === state.screen)));
  document.querySelectorAll("#themes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === state.theme)));
  document.querySelectorAll(".sw").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === state.color)));
}
function go(s) {
  const map = { home: "home", list: "list", detail: "detail", inbox: "list", pay: "list", exp: "list", users: "list", roles: "list", depts: "list" };
  state.screen = map[s] || s; state.open = false; save(); render(); window.scrollTo(0, 0);
}
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span class="ok">${ic("check")}</span><span>${msg}</span>`;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-s],[data-t],[data-c],[data-open],#collapse,#openMenu,#scrim");
  if (!t) return;
  if (t.matches("a")) e.preventDefault();
  if (t.dataset.s) go(t.dataset.s);
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.t) { state.theme = t.dataset.t; applyTheme(); save(); render(); }
  else if (t.dataset.c) { state.color = t.dataset.c; applyBrand(state.color); save(); render(); }
  else if (t.hasAttribute("data-open")) { document.getElementById("e-purpose").hidden = true; document.getElementById("f-purpose").removeAttribute("aria-invalid"); document.getElementById("dlg").showModal(); }
  else if (t.id === "collapse") { state.collapsed = !state.collapsed; save(); render(); }
  else if (t.id === "openMenu") { state.open = true; render(); }
  else if (t.id === "scrim") { state.open = false; render(); }
});
document.getElementById("customColor").addEventListener("input", (e) => { state.color = e.target.value; applyBrand(state.color); save(); render(); });
document.getElementById("dlgCancel").addEventListener("click", () => document.getElementById("dlg").close());
document.getElementById("dlgForm").addEventListener("submit", (e) => {
  const p = document.getElementById("f-purpose");
  if (!p.value.trim()) { e.preventDefault(); p.setAttribute("aria-invalid", "true"); document.getElementById("e-purpose").hidden = false; p.focus(); return; }
  e.preventDefault(); document.getElementById("dlg").close(); p.value = ""; toast("Đã lưu nháp phiếu TU-2026-0149.");
});
document.addEventListener("submit", (e) => { if (e.target.id === "loginForm") { e.preventDefault(); go("home"); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open) { state.open = false; render(); } });

applyBrand(state.color); applyTheme(); render();
</script>
