# Production trên một VPS. Chạy từ /opt/app: docker compose -f infra/compose.prod.yml ...
# Secret nằm trong infra/.env (chmod 600, không commit). APP_TAG do infra/deploy.sh đặt.
name: app

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-app: &app
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
  logging: *logging
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Thiếu DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Thiếu ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    networks: [internal]
    depends_on: [api, web]

  web:
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}/web:${APP_TAG:?Thiếu APP_TAG}
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  api:
    <<: *app
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}/api:${APP_TAG:?Thiếu APP_TAG}
    deploy:
      resources:
        limits: { memory: 768M }

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}/worker:${APP_TAG:?Thiếu APP_TAG}
    stop_grace_period: 40s
    deploy:
      resources:
        limits: { memory: 512M }

  # Chạy một lần mỗi lần deploy: docker compose run --rm migrate
  migrate:
    <<: *app
    image: ${IMAGE_PREFIX:?Thiếu IMAGE_PREFIX}/api:${APP_TAG:?Thiếu APP_TAG}
    restart: "no"
    profiles: [tools]
    command: ["node", "node_modules/@app/db/dist/migrate.js"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB}
      TZ: UTC
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    networks: [internal]

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
