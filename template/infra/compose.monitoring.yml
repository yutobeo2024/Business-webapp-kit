# Giám sát uptime từ BÊN NGOÀI. Chạy trên một VPS nhỏ KHÁC máy production, để khi production chết vẫn có cảnh báo.
#   docker compose -f compose.monitoring.yml up -d   -> mở http://<ip>:3001 tạo tài khoản
# Thêm monitor HTTP(s) tới https://<DOMAIN>/api/health, chu kỳ 60 giây, kênh thông báo Telegram/email/webhook.
# Lỗi ứng dụng (exception): dùng Sentry hoặc GlitchTip tự host (xem docs/runbooks/monitoring.md).
name: monitoring
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes: [kuma_data:/app/data]
volumes:
  kuma_data:
