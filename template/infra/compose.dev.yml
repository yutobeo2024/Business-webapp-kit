# Dịch vụ cho môi trường dev: PostgreSQL + Redis. Chạy: pnpm dev:services
name: app-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_dev
    ports: ["5432:5432"]
    volumes:
      - pg_dev:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pg_dev:
