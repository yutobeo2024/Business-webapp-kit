name: Kit CI

# CI của chính repo kit: chạy bộ kiểm của template trên HAI biến thể, vì dự án thật dùng cả hai:
#   with-sample    : template như khi vừa cài (còn module mẫu phiếu đề nghị)
#   sample-removed : sau `pnpm sample:remove` (trạng thái của dự án khi đã có module thật đầu tiên)
# Thêm: cài dự án mới bằng install.sh, build 3 image + trivy image + smoke in PDF, quét secret/lỗ hổng, actionlint.
# Không deploy gì: kit không có máy chủ.
on:
  pull_request:
  push:
    branches: [master, main, "kit-*"]
  workflow_dispatch:

concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.24.2
  TRIVY_VERSION: 0.62.1
  ACTIONLINT_VERSION: 1.7.7

jobs:
  quality:
    name: Chất lượng (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [with-sample, sample-removed]
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gỡ module mẫu
        if: matrix.variant == 'sample-removed'
        run: |
          pnpm sample:remove --no-verify
          # Commit cục bộ (không đẩy đi) để bước kiểm drift migration so với trạng thái đã gỡ.
          git add -A . && git -c user.name=ci -c user.email=ci@localhost commit -qm "ci: gỡ module mẫu"
          if git grep -nE 'purchase-request|PurchaseRequest|PR_PERMISSIONS' -- . ':!scripts' ':!packages/db/migrations' ':!*.md'; then
            echo "::error::Còn tham chiếu module mẫu trong mã sau khi gỡ"; exit 1
          fi
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tự kiểm hook Claude Code
        run: pnpm claude:selftest
      - name: Shellcheck script vận hành
        run: shellcheck -x infra/*.sh tests/infra/*.sh
      - name: Script vận hành có quyền chạy (+x) trong index của kit
        run: |
          bad=$(git ls-files -s infra/*.sh tests/infra/*.sh | grep -v '^100755' || true)
          if [ -n "$bad" ]; then echo "::error::Thiếu bit +x: git update-index --chmod=+x <file>"; echo "$bad"; exit 1; fi
      - name: Kiểm hành vi script vận hành (docker giả)
        run: bash tests/infra/run.sh
      - name: Migration không phá tương thích, script gỡ mẫu
        run: node --test scripts/check-migrations.test.mjs scripts/remove-sample.test.mjs scripts/project-setup.test.mjs && node scripts/check-migrations.mjs
      - name: Migration khớp schema
        run: |
          pnpm --filter @app/db exec drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::schema.ts lệch migration"; git status --porcelain packages/db/migrations; exit 1
          fi

  integration:
    name: Tích hợp (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [with-sample, sample-removed]
    defaults:
      run:
        working-directory: template
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/15
      TEST_SMTP_URL: smtp://localhost:1025
      TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gỡ module mẫu
        if: matrix.variant == 'sample-removed'
        run: pnpm sample:remove --no-verify
      - run: pnpm build
      - name: Chromium cho test tích hợp worker (in PDF)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
      - name: Khôi phục DB thật
        run: bash tests/infra/restore-real.sh

  e2e:
    name: E2E (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [with-sample, sample-removed]
    defaults:
      run:
        working-directory: template
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/app_e2e
      REDIS_URL: redis://localhost:6379/14
      APP_ORIGIN: http://localhost:4173
      TRUST_PROXY_HOPS: "1"
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: e2e-mat-khau-chi-dung-trong-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gỡ module mẫu
        if: matrix.variant == 'sample-removed'
        run: pnpm sample:remove --no-verify
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm db:seed -- --demo
      - name: Khởi động API và web preview
        run: |
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm exec vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4173/api/health && exit 0
            sleep 2
          done
          cat /tmp/api.log /tmp/web.log
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.variant }}
          path: template/playwright-report
          retention-days: 7

  install:
    name: Cài dự án mới bằng install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - name: Tạo dự án, nhánh main, script có +x, cài và kiểm nhanh
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          ./install.sh "$RUNNER_TEMP/du-an-moi"
          cd "$RUNNER_TEMP/du-an-moi"
          test "$(git branch --show-current)" = main
          bad=$(git ls-files -s infra/*.sh | grep -v '^100755' || true); test -z "$bad"
          # DB riêng theo tên thư mục dự án (nhiều dự án dùng chung dịch vụ dev).
          grep -qx 'DATABASE_URL=postgresql://app:app@localhost:5432/du_an_moi_dev' .env
          grep -qx 'TEST_DATABASE_URL=postgresql://app:app@localhost:5432/du_an_moi_test' .env
          pnpm install --frozen-lockfile
          pnpm build
          pnpm verify:quick
      - name: Node lệch 22/24 thì installer dừng
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\necho 25\n' > "$RUNNER_TEMP/fake/node" && chmod +x "$RUNNER_TEMP/fake/node"
          if PATH="$RUNNER_TEMP/fake:$PATH" ./install.sh "$RUNNER_TEMP/du-an-2" 2> "$RUNNER_TEMP/err.txt"; then
            echo "::error::install.sh không chặn Node 25"; exit 1
          fi
          grep -q "Cần Node 22 hoặc 24" "$RUNNER_TEMP/err.txt" || { cat "$RUNNER_TEMP/err.txt"; exit 1; }
          test ! -e "$RUNNER_TEMP/du-an-2"
      - name: Ghi phiên bản kit vào dự án
        run: grep -q '"version"' "$RUNNER_TEMP/du-an-moi/.kit.json"
      - name: Cách Use this template - chép template, pnpm project:setup, .env riêng, chạy lại không ghi đè
        run: |
          D="$RUNNER_TEMP/Dự Án Thử"
          cp -r template "$D" && cd "$D"
          node scripts/project-setup.mjs
          grep -qx 'DATABASE_URL=postgresql://app:app@localhost:5432/du_an_thu_dev' .env
          echo 'GIU=1' >> .env
          node scripts/project-setup.mjs | grep -q 'giữ nguyên'
          grep -qx 'GIU=1' .env

  kit-sync:
    name: Nâng cấp dự án bằng kit-sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # cần tag kit-v*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - name: Test công cụ (repo kit và dự án giả, phát hành repo template giả)
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          node --test scripts/kit-sync.test.mjs scripts/publish-template.test.mjs
      - name: Dự án cài từ bản kit trước, có sửa của dự án, nâng lên bản mới nhất, build và kiểm nhanh
        run: |
          mapfile -t TAGS < <(git tag -l 'kit-v*' --sort=v:refname | tail -2)
          [ "${#TAGS[@]}" -eq 2 ] || { echo "Cần ít nhất 2 tag kit-v*"; exit 1; }
          FROM="${TAGS[0]#kit-v}"
          git worktree add -q "$RUNNER_TEMP/kit-cu" "${TAGS[0]}"
          bash "$RUNNER_TEMP/kit-cu/install.sh" "$RUNNER_TEMP/du-an"
          cd "$RUNNER_TEMP/du-an"
          printf '\n// Sửa của dự án: phải còn sau khi nâng kit.\n' >> apps/api/src/main.ts
          git commit -qam "feat: sửa của dự án"
          node "$GITHUB_WORKSPACE/scripts/kit-sync.mjs" . --from "$FROM"
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!docs/kit-sync'; then echo "::error::Còn xung đột"; exit 1; fi
          grep -q "Sửa của dự án" apps/api/src/main.ts
          grep -q "\"version\": \"${TAGS[1]#kit-v}\"" .kit.json
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm verify:quick

  security:
    name: Quét bảo mật
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Secret trong lịch sử git của kit (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" "zricethezav/gitleaks:${GITLEAKS_VERSION}"
          detect --source /repo --config /repo/template/.gitleaks.toml --redact --no-banner
      - name: Lint workflow (actionlint, kèm shellcheck)
        # Workflow của template lint như một repo riêng (uses: ./.github/... tính theo gốc dự án, actionlint cần .git).
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color .github/workflows/kit-ci.yml
          mkdir -p "$RUNNER_TEMP/tpl" && cp -r template/.github "$RUNNER_TEMP/tpl/" && git init -q "$RUNNER_TEMP/tpl"
          docker run --rm -v "$RUNNER_TEMP/tpl:/repo" -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION}" -color
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: template/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: template/.nvmrc
      - name: Lỗ hổng trong dependency production
        working-directory: template
        run: pnpm audit --prod --audit-level high
      - name: Lỗ hổng và cấu hình sai (trivy fs)
        run: >-
          docker run --rm -v "$PWD/template:/src" "aquasec/trivy:${TRIVY_VERSION}"
          fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  images:
    name: Image ${{ matrix.app }} (build, trivy, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: template
          file: template/infra/docker/${{ matrix.app }}.Dockerfile
          load: true
          tags: kit-${{ matrix.app }}:ci
          cache-from: type=gha,scope=kit-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=kit-${{ matrix.app }}
      - name: Image không chạy bằng root
        run: |
          user=$(docker image inspect --format '{{.Config.User}}' "kit-${{ matrix.app }}:ci")
          if [ -z "$user" ] || [ "$user" = root ] || [ "$user" = 0 ]; then echo "::error::Image chạy root"; exit 1; fi
      - name: Lỗ hổng trong image (trivy image)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "kit-${{ matrix.app }}:ci"
      - name: Chromium và font tiếng Việt trong image worker in được PDF
        if: matrix.app == 'worker'
        run: bash template/tests/infra/worker-pdf-smoke.sh kit-worker:ci
